name: Upload Release to 123pan

# 把已发布 GitHub Release 的资产经东京服务器中转到 123 云盘（GitHub runner 直传 123 极慢）。
# release.yml 在 publish-release 成功后自动调用（workflow_call）；也可手动补传历史版本：
#   gh workflow run pan123-upload.yml --ref main -f tag=v0.6.3 [-f pattern='*.apk'] [-f dry-run=true]
# 逻辑在 .github/scripts/pan123_mirror.sh：runner 只经 SSH 把脚本送到服务器执行，逐个文件下载 → 上传 →
# 删除，远端已有同大小文件跳过；临时目录在脚本任何退出时清理。服务器 SSH 复用 deploy-website-v2 的 secrets。
run-name: "123 云盘上传 ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布 release 的 tag（如 v0.6.3、v0.6.4-rc.1、历史组件 release extension-v0.4.8）
        required: true
        type: string
      pattern:
        description: 只上传匹配的资产（shell 通配，留空 = 全部）
        required: false
        default: ""
        type: string
      dry-run:
        description: 只列出将上传的文件，不上传
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      pattern:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pan123-upload-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ inputs.tag }} via server
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Relay through server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DAV_USER: ${{ secrets.PAN123_WEBDAV_USER }}
          DAV_PASSWORD: ${{ secrets.PAN123_WEBDAV_PASSWORD }}
          TAG: ${{ inputs.tag }}
          PATTERN: ${{ inputs.pattern || '' }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$DAV_USER" ] || [ -z "$DAV_PASSWORD" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "⚠️  PAN123_WEBDAV_* / DEPLOY_* secrets not configured, skipping 123pan mirror"
            exit 0
          fi
          KEY=$(mktemp); trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY"; chmod 600 "$KEY"
          # 凭据与参数以 export 行前置在 stdin 脚本里，不出现在任一端的进程参数中
          {
            printf 'export DAV_USER=%q DAV_PASSWORD=%q TAG=%q REPO=%q PATTERN=%q DRY_RUN=%q\n' \
              "$DAV_USER" "$DAV_PASSWORD" "$TAG" "$GITHUB_REPOSITORY" "$PATTERN" "$DRY_RUN"
            cat .github/scripts/pan123_mirror.sh
          } | ssh -i "$KEY" -p "${SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$SSH_USER@$SSH_HOST" 'bash -s'
